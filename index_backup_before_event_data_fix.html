<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b79cff"><title>Pattaya Dinosaur Kingdom</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#28324d;background:linear-gradient(135deg,#fff2a8,#bdeaff,#f2c8ff,#b9ffd9);min-height:100vh}main{max-width:1100px;margin:auto;padding:10px}.g{background:#ffffff75;border:1px solid #fff;border-radius:25px;box-shadow:0 16px 45px #66508022,inset 0 1px #fff;backdrop-filter:blur(20px)}header{padding:14px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;background:#b58af5;border-radius:17px;padding:8px 12px}.brand{display:flex;gap:10px;align-items:center}small{opacity:.55}nav{display:flex;gap:7px;overflow:auto;margin:11px 0}nav a{padding:10px 13px;background:#fff9;border-radius:14px;text-decoration:none;color:#594b7b;font-weight:850;white-space:nowrap}nav a.on{background:linear-gradient(135deg,#9877ef,#d36db4);color:#fff}.hero{padding:22px;margin-bottom:12px}h1{font-size:clamp(40px,7vw,72px);line-height:.9;margin:12px 0}h1 span{color:#956de8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card,.ticket{padding:14px}.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.pic{border-radius:18px;overflow:hidden;background:#fff9;display:flex;justify-content:center;align-items:center;font-size:50px}.pic img{width:100%;height:auto;max-height:none;display:block;object-fit:contain}input,button{font:inherit}input{width:100%;border:0;border-radius:12px;padding:11px;background:#fff9;margin:6px 0}button,.btn{border:0;border-radius:13px;padding:10px 14px;background:linear-gradient(135deg,#9978ee,#d56db6);color:#fff;font-weight:850;cursor:pointer;display:inline-block;text-decoration:none}.total{padding:16px;margin:12px 0;display:flex;justify-content:space-between;font-size:19px;font-weight:900}footer{padding:18px 5px;font-size:10px;opacity:.5}.modal{display:none;position:fixed;inset:0;background:#30204466;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.box{padding:18px;width:min(470px,100%)}.preview{max-height:260px;overflow:hidden;border-radius:16px;background:#fff9;margin:6px 0;text-align:center}.preview img{max-width:100%;height:auto;display:block;margin:auto}.acts{display:flex;gap:8px}.acts>*{flex:1}@media(max-width:700px){.tickets,.grid{grid-template-columns:1fr 1fr}}@media(max-width:460px){.tickets,.grid{grid-template-columns:1fr}}
</style></head><body><main><header class="g"><div class="brand"><div class="logo">🦖</div><div><small>PRIVATE OWNER WEBSITE</small><b>PATTAYA DINOSAUR KINGDOM</b></div></div><b>● OWNER ONLY</b></header><div id="app"></div><footer>Private Owner • Ticket Counter • v1.9</footer></main>
<div class="modal" id="modal"><div class="box g"><h3>✏️ Edit Ticket</h3><input id="name" placeholder="Ticket name"><div class="preview" id="prev">No image selected</div><input id="file" type="file" accept="image/*"><div class="acts"><button onclick="closeM()">Cancel</button><button onclick="saveM()">Save</button></div></div></div>
<script>
const D={sale:[['Adult','👨'],['Kid','🧒'],['Small','👦'],['VIP','⭐'],['Kids Entry Ticket','🎟️']],entry:[['Adult','👨‍👩‍👦'],['Kid','🧒'],['Small','👦'],['VIP','⭐'],['Kids Entry Ticket','🎟️']],playing:[['50฿ Activity Ticket','🦴',50],['100฿ Activity Ticket','🦖',100],['200฿ Activity Ticket','🥚',200],['Package A','🎁'],['Package B','🎁'],['Promotion Rider','🏍️']]};
let S=JSON.parse(localStorage.pdS||'{}'),M=JSON.parse(localStorage.pdM||'{}'),E=JSON.parse(localStorage.pdE||'null'),H=JSON.parse(localStorage.pdH||'[]'),EC=localStorage.pdEC||'';if(!Array.isArray(E)){E=E&&typeof E==='object'?[E]:[]}if(!E.length)E=[{name:'Event Ticket',qty:0,img:''}];if(!Array.isArray(H))H=[];for(let k in D){S[k]??={};M[k]??={}}if(!M.playing[0]||!M.playing[0].img)M.playing[0]={...(M.playing[0]||{}),name:(M.playing[0]&&M.playing[0].name)||'50฿ Activity Ticket',img:(M.playing[0]&&M.playing[0].img)||''};
const APP=document.getElementById('app');
let t,i;
function go(p){
  const allowed=['home','sale','entry','playing','event','scanner','report','history','settings'];
  if(!allowed.includes(p)) p='home';
  if(location.hash !== '#'+p) location.hash=p;
  render();
  window.scrollTo(0,0);
}
function db(){localStorage.pdS=JSON.stringify(S);localStorage.pdM=JSON.stringify(M);localStorage.pdE=JSON.stringify(E);localStorage.pdH=JSON.stringify(H);localStorage.pdEC=EC}function total(k){return Object.values(S[k]).reduce((a,b)=>a+(+b||0),0)}function nav(a){return '<nav>'+[['home','🏠 Home'],['sale','🎟️ Sale'],['entry','🌿 Entry'],['playing','🦴 Playing'],['event','🎪 Event Ticket'],['scanner','🔎 Scanner'],['report','📊 Report'],['history','📜 History'],['settings','⚙️ Settings']].map(x=>`<a class="${a==x[0]?'on':''}" href="#${x[0]}" onclick="go('${x[0]}');return false;">${x[1]}</a>`).join('')+'</nav>'}function hero(x,h,p){return `<section class="hero g"><small>${x}</small><h1>${h}</h1><p>${p}</p></section>`}
function page(k){let h=k=='sale'?'Sale<br><span>Tickets.</span>':k=='entry'?'Entry<br><span>Tickets.</span>':'Playing<br><span>Tickets.</span>';APP.innerHTML=nav(k)+hero(k.toUpperCase(),h,'Edit ticket name/image and record quantities.')+'<div class="tickets" id="list"></div><div class="total g"><span>Total Tickets</span><b id="tot"></b></div>';document.getElementById('list').innerHTML=D[k].map((x,n)=>{let m=M[k][n]||{};return `<article class="ticket g"><div class="pic">${m.img?`<img src="${m.img}">`:x[1]}</div><small>${x[0]}</small><h3>${m.name||x[0]}</h3>${x[2]?`<b>${x[2]}฿</b>`:''}<input type="number" min="0" value="${S[k][n]||0}" data-i="${n}"><button onclick="edit('${k}',${n})">✏️ Edit Name / Image</button></article>`}).join('');document.getElementById('tot').textContent=total(k);document.getElementById('list').querySelectorAll('input').forEach(q=>q.oninput=()=>{S[k][q.dataset.i]=Math.max(0,+q.value||0);db();document.getElementById('tot').textContent=total(k)})}
function addEvent(){E.push({name:'New Event Ticket',qty:0,img:''});db();eventPage()}
function saveCenter(){let el=document.getElementById('eventCenter');EC=el?el.value.trim():'';db();alert('Event Location saved');eventPage()}
function eventPage(){
  const safeEC=String(EC||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  APP.innerHTML=nav('event')+`<section class="card g" style="margin:12px 0"><h3>📍 Event Location / Center</h3><input id="eventCenter" value="${safeEC}" placeholder="Enter event location / center"><button onclick="saveCenter()">💾 Save Location</button></section>`+hero('🎪 EVENT TICKET','Event<br><span>Tickets.</span>','Manage your event tickets and quantities below.')+'<div class="tickets" id="list"></div><div class="total g"><span>Total Event Tickets</span><b id="tot"></b></div><button onclick="addEvent()">＋ Add Event Ticket</button>';
  const l=document.getElementById('list'),tt=document.getElementById('tot');
  if(!l||!tt)return;
  l.innerHTML=E.map((x,n)=>`<article class="ticket g"><div class="pic">${x.img?`<img src="${x.img}" alt="${String(x.name||'Event Ticket').replace(/"/g,'&quot;')}">`:'🎪'}</div><small>Event Ticket</small><h3>${x.name||'Event Ticket'}</h3><input type="number" min="0" value="${x.qty||0}" data-i="${n}"><button onclick="edit('event',${n})">✏️ Edit Name / Image</button></article>`).join('');
  tt.textContent=E.reduce((a,x)=>a+(+x.qty||0),0);
  l.querySelectorAll('input').forEach(q=>q.oninput=()=>{E[+q.dataset.i].qty=Math.max(0,+q.value||0);db();tt.textContent=E.reduce((a,x)=>a+(+x.qty||0),0)});
}

function edit(k,n){t=k;i=n;let x=k=='event'?E[n]:D[k][n],m=k=='event'?x:(M[k][n]||{});document.getElementById('name').value=m.name||x[0];document.getElementById('prev').innerHTML=m.img?`<img src="${m.img}">`:'No image selected';document.getElementById('file').value='';document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}document.getElementById('file').onchange=()=>{let f=document.getElementById('file').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);document.getElementById('prev').innerHTML=`<img src="${c.toDataURL('image/jpeg',.78)}">`};im.src=r.result};r.readAsDataURL(f)};function saveM(){let nm=document.getElementById('name').value.trim()||'Event Ticket',pv=document.getElementById('prev').querySelector('img'),im=pv?pv.src:'';if(t=='event')E[i]={...E[i],name:nm,img:im};else M[t][i]={name:nm,img:im};db();closeM();render()}
function calcScan(){let av=document.getElementById('a').value,bv=document.getElementById('b').value;document.getElementById('res').textContent=(+bv>=+av&&av&&bv)?(+bv-+av+1)+' Tickets Sold':'Enter valid numbers'}function scanner(){APP.innerHTML=nav('scanner')+hero('🔎 SCANNER','Ticket<br><span>Scanner.</span>','Start and Last numbers are counted inclusively.')+'<section class=\"card g\"><div class=\"grid\"><input id=\"a\" placeholder=\"Start 0001\"><input id=\"b\" placeholder=\"Last 0020\"></div><button onclick=\"calcScan()\">Calculate</button><h3 id=\"res\">0 Tickets Sold</h3></section>'}function saveToday(){H.unshift({d:new Date().toLocaleString(),s:total('sale'),e:total('entry'),p:total('playing'),v:E.reduce((a,x)=>a+(+x.qty||0),0)});db();alert('Saved')}function resetCounters(){if(confirm('Reset counters?')){for(let k in S)S[k]={};E.forEach(x=>x.qty=0);db();render()}}function reportText(){let now=new Date().toLocaleString();let centers=EC?[EC]:[];let lines=['PATTAYA DINOSAUR KINGDOM','Ticket Sales Report','Date: '+now];if(centers.length)lines.push('Event Center: '+[...new Set(centers)].join(', '));lines.push('Sale Tickets: '+total('sale'),'Entry Tickets: '+total('entry'),'Playing Tickets: '+total('playing'),'Event Tickets: '+E.reduce((a,x)=>a+(+x.qty||0),0),'Playing Revenue: '+playingRevenue()+'฿');return lines.join('\n')}function playingRevenue(){return D.playing.reduce((a,x,n)=>a+(x[2]||0)*(+S.playing[n]||0),0)}async function shareReport(){let text=reportText();if(navigator.share){try{await navigator.share({title:'Pattaya Dinosaur Kingdom Report',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Report copied. You can paste it into Facebook, LINE, Telegram or other Social apps.')}catch(e){prompt('Copy this report:',text)}}}function report(){let centers=EC?[EC]:[];APP.innerHTML=nav('report')+hero('📊 DAILY REPORT','Ticket<br><span>Report.</span>','View today\'s totals and share the report to Social apps.')+'<section class="grid"><div class="card g"><small>SALE</small><h2>'+total('sale')+'</h2><p>Sale Tickets</p></div><div class="card g"><small>ENTRY</small><h2>'+total('entry')+'</h2><p>Entry Tickets</p></div><div class="card g"><small>PLAYING</small><h2>'+total('playing')+'</h2><p>Playing Tickets</p></div><div class="card g"><small>EVENT</small><h2>'+E.reduce((a,x)=>a+(+x.qty||0),0)+'</h2><p>Event Tickets</p></div><div class="card g"><small>PLAYING REVENUE</small><h2>'+playingRevenue()+'฿</h2><p>Calculated from ticket prices</p></div><div class="card g"><small>EVENT CENTER</small><h3>'+(centers.length?[...new Set(centers)].join(', '):'Not set')+'</h3><p>Saved for the Event</p></div></section><section class="card g" style="margin-top:11px"><h3>📄 Shareable Report</h3><pre id="rtext" style="white-space:pre-wrap;font:inherit">'+reportText()+'</pre><button onclick="shareReport()">📤 Share to Social</button></section>'}function history(){APP.innerHTML=nav('history')+hero('📜 HISTORY','Ticket<br><span>History.</span>','Saved records on this device.')+'<section class=\"card g\">'+(H.length?H.map(x=>`<p>${x.d} — Sale ${x.s} • Entry ${x.e} • Playing ${x.p} • Event ${x.v}</p>`).join(''):'No saved records yet.')+'</section>'}function settings(){APP.innerHTML=nav('settings')+hero('⚙️ SETTINGS','Owner<br><span>Settings.</span>','Images are resized and saved locally.')+'<section class=\"grid\"><div class=\"card g\"><h3>🎪 Event Ticket</h3><a class=\"btn\" href=\"#event\" data-page=\"event\">Open Event Tickets</a></div><div class=\"card g\"><h3>💾 Save Today</h3><button onclick=\"saveToday()\">Save Today</button></div><div class=\"card g\"><h3>🗑️ Reset</h3><button onclick=\"resetCounters()\">Reset Counters</button></div></section>'} 
function home(){APP.innerHTML=nav('home')+hero('✨ TICKET CONTROL CENTER','Good day,<br><span>Owner.</span>','Choose a dedicated page below.')+'<section class="grid">'+[['sale','🎟️ Sale Ticket'],['entry','🌿 Entry Ticket'],['playing','🦴 Playing Ticket'],['event','🎪 Event Ticket'],['scanner','🔎 Scanner'],['report','📊 Report'],['history','📜 History'],['settings','⚙️ Settings']].map(x=>`<div class="card g"><h3>${x[1]}</h3><a class="btn" href="#${x[0]}" onclick="go('${x[0]}');return false;">Open Page</a></div>`).join('')+'</section>'}
function render(){let p=(location.hash||'#home').slice(1)||'home';if(['sale','entry','playing'].includes(p))page(p);else if(p=='event')eventPage();else if(p=='scanner')scanner();else if(p=='report')report();else if(p=='history')history();else if(p=='settings')settings();else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
window.addEventListener('popstate',function(){render();window.scrollTo(0,0)});
document.addEventListener('DOMContentLoaded',render);
render();
</script></body></html>
