let LOGIN_AT=localStorage.pdLoginAt||new Date().toISOString();localStorage.pdLoginAt=LOGIN_AT;if(!Array.isArray(E)){E=E&&typeof E==='object'?[E]:[]}E=E.filter(x=>x&&typeof x==='object').map(x=>({name:String(x.name||'Event Ticket'),qty:Math.max(0,Number(x.qty)||0),price:Math.max(0,Number(x.price)||0),img:typeof x.img==='string'?x.img:''}));if(!E.length)E=[{name:'Event Ticket',qty:0,price:0,img:''}];const _scooterIdx=E.findIndex(x=>/scooter|สกู๊ตเตอร์/i.test(String(x.name||'')));const _walkingIdx=E.findIndex(x=>/walking|วอล์ค|วอค/i.test(String(x.name||'')));if(_scooterIdx===5&&_walkingIdx===4){const _tmp=E[4];E[4]=E[5];E[5]=_tmp;}if(!Array.isArray(H))H=[];if(!S||typeof S!=='object'||Array.isArray(S))S={};if(!M||typeof M!=='object'||Array.isArray(M))M={};for(let k in D){if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};if(!M[k]||typeof M[k]!=='object'||Array.isArray(M[k]))M[k]={}}if(!M.playing[0]||!M.playing[0].img)M.playing[0]={...(M.playing[0]||{}),name:(M.playing[0]&&M.playing[0].name)||'50฿ Activity Ticket',img:(M.playing[0]&&M.playing[0].img)||''};

const APP=document.getElementById('app');

function go(p){
  const allowed=['home','sale','entry','playing','event','scanner','report','event-report','sale-report','history','settings'];
  if(!allowed.includes(p)) p='home';
  history.pushState({page:p},'', '#'+p);

function openEvent(){ go('event'); return false; }
function db(){localStorage.pdS=JSON.stringify(S);localStorage.pdM=JSON.stringify(M);localStorage.pdE=JSON.stringify(E);localStorage.pdH=JSON.stringify(H);localStorage.pdEC=EC;localStorage.pdLastSaved=new Date().toISOString();APP_META.version=APP_VERSION;APP_META.updatedAt=new Date().toISOString();localStorage.pdAppMeta=JSON.stringify(APP_META)}
function saveSafetySnapshot(reason){try{const snap={version:APP_VERSION,reason,createdAt:new Date().toISOString(),S,M,E,H,EC,ownerGmail:localStorage.pdOwnerGmail||'',reportDate:localStorage.pdReportDate||''};localStorage.pdSafetyBackup=JSON.stringify(snap);localStorage.pdSafetyBackupAt=snap.createdAt;return true}catch(e){console.warn('Safety snapshot failed',e);return false}}
function restoreSafetySnapshot(){try{const d=JSON.parse(localStorage.pdSafetyBackup||'null');if(!d||!d.S||!d.M)throw Error('No safety backup');if(!confirm('Restore the last safety backup? Current data will first be backed up.'))return;saveSafetySnapshot('before-restore');S=d.S;M=d.M;E=Array.isArray(d.E)?d.E:[];H=Array.isArray(d.H)?d.H:[];EC=String(d.EC||'');if(d.ownerGmail)localStorage.pdOwnerGmail=String(d.ownerGmail);if(d.reportDate)localStorage.pdReportDate=String(d.reportDate);db();toast('↩️ Last safety backup restored');setTimeout(render,400)}catch(e){alert('No usable safety backup is available yet.')}}
function setReportDate(v){let d=String(v||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=new Date().toISOString().slice(0,10);localStorage.pdReportDate=d;toast('📅 Report date updated');render()}
function reportDateISO(){return localStorage.pdReportDate||new Date().toISOString().slice(0,10)}
function reportDateThai(){let d=new Date(reportDateISO()+'T00:00:00');if(Number.isNaN(d.getTime()))d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String((d.getFullYear()+543)%100).padStart(2,'0')}function total(k){return Object.values(S[k]).reduce((a,b)=>a+(+b||0),0)}function nav(a){return '<nav>'+[['home','🏠 Home'],['sale','🎟️ Sale'],['entry','🌿 Entry'],['playing','🦴 Playing'],['event','🎪 Event Ticket'],['scanner','🔎 Scanner'],['report','📊 Reports'],['history','📜 History'],['settings','⚙️ Settings']].map(x=>`<a class="${a==x[0]?'on':''}" href="#${x[0]}" data-go="${x[0]}">${x[1]}</a>`).join('')+`<button type="button" onclick="shareCurrentReport()">📤 Share Report</button></nav>`}

function page(k){
 let h=k=='sale'?'Sale<br><span>Tickets.</span>':k=='entry'?'Entry<br><span>Tickets.</span>':'Playing<br><span>Tickets.</span>';
 let extra=k=='sale'?`<section class="card g" style="margin-top:11px"><h3>📊 Sale Ticket Report</h3><p>Create and share the Sale Ticket report separately.</p><button onclick="go('sale-report')">Open Sale Ticket Report</button></section>`:'';
 APP.innerHTML=nav(k)+hero(k.toUpperCase(),h,'Enter quantity and ticket price. Changes are saved automatically on this device.')+'<div class="tickets" id="list"></div><div class="total g"><span>Total Tickets</span><b id="tot"></b></div><div class="total g"><span>Total Amount</span><b id="amt">0 ฿</b></div>'+extra;
 document.getElementById('list').innerHTML=D[k].map((x,n)=>{let m=M[k][n]||{},price=m.price!=null?Math.max(0,Number(m.price)||0):Math.max(0,Number(x[2])||0),qty=Math.max(0,Number(S[k][n])||0);return `<article class="ticket g"><div class="pic">${m.img?`<img src="${m.img}">`:x[1]}</div><small>${x[0]}</small><h3>${m.name||x[0]}</h3><label class="muted" style="display:block;font-size:12px;font-weight:800">PRICE / TICKET (THB)</label><input class="ticket-price" type="number" min="0" step="1" inputmode="decimal" value="${price}" data-i="${n}" placeholder="Enter price"><label class="muted" style="display:block;font-size:12px;font-weight:800">QUANTITY</label><input class="ticket-qty" type="number" min="0" step="1" inputmode="numeric" value="${qty}" data-i="${n}" placeholder="Enter quantity"><div class="card g" style="padding:9px;margin:7px 0;background:#fff8"><span class="muted">TOTAL</span> <b class="row-total">${(qty*price).toLocaleString()} ฿</b></div><button onclick="edit('${k}',${n})">✏️ Edit Name / Image</button></article>`}).join('');
 const updateTotals=()=>{let tq=0,ta=0;D[k].forEach((x,n)=>{let q=Math.max(0,Number(S[k][n])||0),p=Math.max(0,Number(M[k][n]&&M[k][n].price!=null?M[k][n].price:x[2])||0);tq+=q;ta+=q*p;let card=document.getElementById('list').children[n];if(card){let r=card.querySelector('.row-total');if(r)r.textContent=(q*p).toLocaleString()+' ฿'}});document.getElementById('tot').textContent=tq;document.getElementById('amt').textContent=ta.toLocaleString()+' ฿';db()};
 document.getElementById('list').querySelectorAll('.ticket-qty').forEach(q=>q.oninput=()=>{let n=+q.dataset.i;S[k][n]=Math.max(0,Number(q.value)||0);updateTotals()});
 document.getElementById('list').querySelectorAll('.ticket-price').forEach(q=>q.oninput=()=>{let n=+q.dataset.i;M[k][n]=M[k][n]||{};M[k][n].price=Math.max(0,Number(q.value)||0);updateTotals()});
 updateTotals();
 APP.insertAdjacentHTML('beforeend','<section class="card g" style="margin-top:11px"><button onclick="shareReportImage('+JSON.stringify(k)+')">📤 Share Report Image</button></section>')
}
function addEvent(){t='event';i=-1;document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('prev').textContent='No image selected';document.getElementById('file').value='';document.getElementById('modal').classList.add('show')}
function deleteEvent(n){if(!E[n])return;if(confirm('Delete this Event Ticket?')){E.splice(n,1);if(!E.length)E=[{name:'Event Ticket',qty:0,price:0,img:''}];db();eventPage()}}

  const safeEC=String(EC||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  APP.innerHTML=nav('event')+`<section class="card g" style="margin:12px 0"><h3>📍 Event Location / Center</h3><input id="eventCenter" value="${safeEC}" placeholder="Enter event location / center"><button onclick="saveCenter()">💾 Save Location</button></section>`+hero('🎪 EVENT TICKET','Event<br><span>Tickets.</span>','Manage your event tickets and quantities below.')+`<section class="card g" style="margin:0 0 12px"><h3>📊 Event Ticket Report</h3><p>View and share only the Event Ticket report.</p><a class="btn" href="#event-report" data-go="event-report">📊 Open Event Ticket Report</a></section><div class="tickets" id="list"></div><div class="total g"><span>Total Event Tickets</span><b id="tot">0</b></div><div class="total g"><span>Total Event Amount</span><b id="eventAmount">0 ฿</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0"><button onclick="addEvent()">＋ Add Event Ticket</button><button onclick="go('event-report')">📊 Event Ticket Report</button><button onclick="shareReportImage('event')">📤 Share Event Report Image</button><button onclick="downloadReportImage('event')">⬇️ Save Event Report Image</button></div>`;

      <label class="muted" style="display:block;font-size:12px;font-weight:800">PRICE / TICKET (THB)</label>
      <div class="stepper"><button type="button" aria-label="Decrease price" onclick="changeEventPrice(${n},-10)">−</button><input class="event-price" type="number" min="0" step="1" inputmode="decimal" value="${price}" data-price="${n}" aria-label="Price per ticket"><button type="button" aria-label="Increase price" onclick="changeEventPrice(${n},10)">＋</button></div>
      <small class="muted">Price buttons change by 10 THB. You can also type a price directly.</small>
      <label class="muted" style="display:block;font-size:12px;font-weight:800;margin-top:8px">QUANTITY</label>

  l.querySelectorAll('.event-qty').forEach(q=>q.oninput=()=>{const n=+q.dataset.qty;if(!E[n])return;E[n].qty=Math.max(0,Math.floor(Number(q.value)||0));updateEventTotals()});

function edit(k,n){t=k;i=n;let x=k=='event'?E[n]:D[k][n],m=k=='event'?x:(M[k][n]||{});document.getElementById('name').value=m.name||x[0];document.getElementById('price').value=k==='event'?(m.price||0):'';document.getElementById('prev').innerHTML=m.img?`<img src="${m.img}">`:'No image selected';document.getElementById('file').value='';document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}document.getElementById('file').onchange=()=>{let f=document.getElementById('file').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);document.getElementById('prev').innerHTML=`<img src="${c.toDataURL('image/jpeg',.78)}">`};im.src=r.result};r.readAsDataURL(f)};function saveM(){let nm=document.getElementById('name').value.trim()||'Event Ticket',pv=document.getElementById('prev').querySelector('img'),im=pv?pv.src:'';if(t=='event'){if(i<0)E.push({name:nm,qty:0,price:Math.max(0,Number(document.getElementById('price').value)||0),img:im});else E[i]={...E[i],name:nm,price:Math.max(0,Number(document.getElementById('price').value)||0),img:im}}else M[t][i]={...(M[t][i]||{}),name:nm,price:Math.max(0,Number(document.getElementById('price').value)||0),img:im};db();closeM();render()}
function calcScan(){let av=document.getElementById('a').value,bv=document.getElementById('b').value;document.getElementById('res').textContent=(+bv>=+av&&av&&bv)?(+bv-+av+1)+' Tickets Sold':'Enter valid numbers'}function scanner(){APP.innerHTML=nav('scanner')+hero('🔎 SCANNER','Ticket<br><span>Scanner.</span>','Start and Last numbers are counted inclusively.')+'<section class=\"card g\"><div class=\"grid\"><input id=\"a\" placeholder=\"Start 0001\"><input id=\"b\" placeholder=\"Last 0020\"></div><button onclick=\"calcScan()\">Calculate</button><h3 id=\"res\">0 Tickets Sold</h3></section>'}function toast(msg){let el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}

function currentReportText(){
 let p=(location.hash||'#home').slice(1)||'home',now=reportDateISO();
 let labels={home:'Home',sale:'Sale Ticket',entry:'Entry Ticket',playing:'Playing Ticket',event:'Event Ticket',scanner:'Scanner',report:'Reports',history:'History',settings:'Settings','event-report':'Event Ticket Report','sale-report':'Sale Ticket Report'};
 if(p==='event-report')return eventReportText();
 if(p==='sale-report')return saleReportText();
 let lines=['PATTAYA DINOSAUR KINGDOM',(labels[p]||'Owner Page')+' REPORT','Date: '+now];
 if(p==='sale'||p==='entry'||p==='playing')lines.push('Tickets: '+total(p));
 else if(p==='event')lines.push('Event Tickets: '+E.reduce((a,x)=>a+(+x.qty||0),0),'Event Center: '+(EC||'Not set'));
 else if(p==='home')lines.push('Sale Tickets: '+total('sale'),'Entry Tickets: '+total('entry'),'Playing Tickets: '+total('playing'),'Event Tickets: '+E.reduce((a,x)=>a+(+x.qty||0),0));
 else lines.push('Page: '+(labels[p]||'Owner Page'));
 lines.push('','Thank you - Pattaya Dinosaur Kingdom');
 return lines.join('\n');
}

function fitText(ctx,txt,maxWidth,font){
 ctx.font=font;
 let s=String(txt);
 if(ctx.measureText(s).width<=maxWidth)return s;
 while(s.length>3&&ctx.measureText(s+'…').width>maxWidth)s=s.slice(0,-1);
 return s+'…';
}

async function shareReportImage(kind){
 const c=await buildReportImage(kind);
 const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));
 if(!blob){alert('Could not create the report image.');return}
 const file=new File([blob],`Pattaya-Dinosaur-Kingdom-${kind}-Report.png`,{type:'image/png'});
 // Share the generated image together with the Event/Sale report text when the browser supports file+text sharing.
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({title:kind==='event'?'Pattaya Dinosaur Kingdom - Event Ticket Report':'Pattaya Dinosaur Kingdom - Report',text:kind==='event'?eventReportText():kind==='sale'?saleReportText():reportText(),files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 const fallbackText=kind==='event'?eventReportText():kind==='sale'?saleReportText():reportText();
 try{await navigator.clipboard.writeText(fallbackText);alert('Image saved to your device. Report text copied. Open LINE/Facebook/Telegram and paste the text after attaching the image.')}catch(e){alert('Image saved to your device. Please copy the Report text manually from the Report page.')}
}
function sharePageReport(kind){
 if(kind==='event')return shareReportImage('event');
 if(kind==='sale')return shareReportImage('sale');
 return shareReportImage(kind);
}

function eventReport(){
 let totalEvent=E.reduce((a,x)=>a+(+x.qty||0),0),totalAmount=E.reduce((a,x)=>a+(Math.max(0,Number(x.qty)||0)*Math.max(0,Number(x.price)||0)),0),center=EC?String(EC).trim():'';
 APP.innerHTML=nav('event-report')+hero('🎪 EVENT TICKET REPORT','Event<br><span>Report.</span>','Only Event Ticket sales are shown on this page.')+
 '<section class="grid"><div class="card g"><small>EVENT TICKETS</small><h2>'+totalEvent+'</h2><p>Total Event Tickets</p></div><div class="card g"><small>TOTAL AMOUNT</small><h2>'+totalAmount.toLocaleString()+' ฿</h2><p>Event Ticket Revenue</p></div><div class="card g"><small>EVENT CENTER</small><h3>'+(center||'Not set')+'</h3><p>📅 '+reportDateThai()+'</p></div></section><section class="card g" style="margin:12px 0"><h3>🎪 Add / Manage Event Tickets</h3><p>Add a new ticket, change ticket name/image, and enter ticket quantities from the Event Ticket page.</p><a class="btn" href="#event" data-go="event">＋ Open Event Ticket & Add Tickets</a></section>'+reportButtons(eventReportText(),'Pattaya Dinosaur Kingdom - Event Ticket Report','Pattaya-Dinosaur-Kingdom-Event-Ticket-Report','event')
}
function saleReport(){
 let totalSale=total('sale');
 APP.innerHTML=nav('sale-report')+hero('🎟️ SALE TICKET REPORT','Sale<br><span>Report.</span>','Only Sale Ticket sales are shown on this page.')+
 '<section class="card g"><small>SALE TICKETS</small><h2>'+totalSale+'</h2><p>Total Sale Tickets</p></section>'+reportButtons(saleReportText(),'Pattaya Dinosaur Kingdom - Sale Ticket Report','Pattaya-Dinosaur-Kingdom-Sale-Ticket-Report','sale')
}
function history(){let sum=H.reduce((a,x)=>a+(+x.s||+x.sale||0)+(+x.e||+x.entry||0)+(+x.p||+x.playing||0)+(+x.v||+x.event||0),0);APP.innerHTML=nav('history')+hero('📜 HISTORY','Ticket<br><span>History.</span>','Saved daily closing records. Old records are kept during upgrades.')+`<section class="stat-grid"><div class="stat card g"><small>Saved Days</small><b>${H.length}</b></div><div class="stat card g"><small>Tickets Recorded</small><b>${sum}</b></div></section><section class="card g">`+(H.length?H.map((x,n)=>{let ev=+x.event||+x.v||0,sl=+x.sale||+x.s||0,en=+x.entry||+x.e||0,pl=+x.playing||+x.p||0,amt=x.amounts?Object.values(x.amounts).reduce((a,b)=>a+(+b||0),0):0;return `<div style="padding:12px 0;border-bottom:1px solid #ffffff88"><b>${x.dateThai||x.d||'Saved record'}</b><br><span class="muted">Sale ${sl} • Entry ${en} • Playing ${pl} • Event ${ev}</span>${amt?`<br><b>Total Amount: ${amt.toLocaleString()} ฿</b>`:''}${x.location?`<br><span class="muted">📍 ${x.location}</span>`:''}</div>`}).join(''):'<p class="muted">No saved records yet. Use Daily Close after finishing the day.</p>')+'</section>'}
function saveOwnerGmail(){let el=document.getElementById('ownerGmail');let v=el?String(el.value||'').trim():'';if(v&&!/^[^\s@]+@gmail\.com$/i.test(v)){alert('Please enter a valid Gmail address.');return}localStorage.pdOwnerGmail=v;alert(v?'Owner Gmail saved.':'Owner Gmail removed.');settings()}
function settings(){let gmail=localStorage.pdOwnerGmail||'',safe=gmail.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),last=localStorage.pdLastSaved?new Date(localStorage.pdLastSaved).toLocaleString():'Not saved yet',safety=localStorage.pdSafetyBackupAt?new Date(localStorage.pdSafetyBackupAt).toLocaleString():'No safety backup yet';APP.innerHTML=nav('settings')+hero('⚙️ SETTINGS','Owner<br><span>Settings.</span>','Application controls, report date and data safety.')+`<section class="grid"><div class="card g" style="grid-column:1/-1"><h3>📅 Report Date</h3><p class="muted">Choose the date printed in Event/Sale reports. This does not change your ticket data.</p><input type="date" value="${reportDateISO()}" onchange="setReportDate(this.value)"><p class="muted" style="margin-bottom:0">Thai report date: <b>${reportDateThai()}</b></p></div><div class="card g" style="grid-column:1/-1"><h3>📍 Event Location / Center</h3><input id="settingsCenter" value="${String(EC||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}" placeholder="เช่น เซ็นทรัลพัทยาบีช"><button onclick="EC=document.getElementById('settingsCenter').value.trim();db();toast('📍 Event Location saved');settings()">💾 Save Location</button></div><div class="card g" style="grid-column:1/-1"><h3>📧 Owner Gmail</h3><input id="ownerGmail" type="email" inputmode="email" autocomplete="email" placeholder="owner@gmail.com" value="${safe}"><button onclick="saveOwnerGmail()">🔗 Save Owner Gmail</button></div><div class="card g"><h3>🎪 Event Ticket</h3><a class="btn" href="#event" data-go="event">Open Event Tickets</a></div><div class="card g"><h3>💾 Daily Close</h3><button onclick="saveToday()">Save Today</button><button onclick="saveAndReset()" style="margin-top:7px">Save & Close Day</button><p class="muted">Save & Close creates a safety backup before resetting.</p></div><div class="card g"><h3>🗑️ Reset</h3><button class="danger" onclick="resetCounters()">Reset Counters</button><button class="secondary" onclick="restoreSafetySnapshot()" style="margin-top:7px">↩️ Restore Last Safety Backup</button></div><div class="card g" style="grid-column:1/-1"><h3>🛡️ Backup & Restore</h3><p class="muted">Existing localStorage data is preserved during app upgrades. Export a backup before changing phones or clearing browser data.</p><div class="data-row"><button onclick="exportBackup()">⬇️ Backup Data</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">⬆️ Restore Data</button></div><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this)"><p class="muted">Last save: <b>${last}</b><br>Last safety backup: <b>${safety}</b></p></div><div class="card g" style="grid-column:1/-1"><h3>📱 App Status</h3><p class="muted">Version <b>${APP_VERSION}</b> • Data keys preserved • Local data storage active</p><p class="muted" style="margin-bottom:0">⚠️ Clearing Chrome/Samsung Internet site data can erase local data. Use Backup Data first.</p></div></section>`}
function home(){let st=total('sale'),en=total('entry'),pl=total('playing'),ev=E.reduce((a,x)=>a+(+x.qty||0),0),all=st+en+pl+ev;APP.innerHTML=nav('home')+hero('✨ TICKET CONTROL CENTER','Good day,<br><span>Owner.</span>','Your live ticket dashboard. Changes are saved automatically on this device.')+`<section class="stat-grid"><div class="stat card g"><small>🎟️ Sale</small><b>${st}</b></div><div class="stat card g"><small>🌿 Entry</small><b>${en}</b></div><div class="stat card g"><small>🦴 Playing</small><b>${pl}</b></div><div class="stat card g"><small>🎪 Event</small><b>${ev}</b></div></section><section class="card g home-share"><button style="width:100%" onclick="shareReportImage('sale')">📤 Share Daily Report Image</button><p class="muted" style="margin:8px 2px 0">Today total: <b>${all}</b> tickets</p></section><div class="quick-title">Quick access</div><section class="card g" style="margin:8px 0"><button style="width:100%" onclick="installApp()">📱 Add to Home Screen / Install App</button></section><section class="home-grid">`+[['sale','🎟️ Sale Ticket'],['entry','🌿 Entry Ticket'],['playing','🦴 Playing Ticket'],['event','🎪 Event Ticket'],['scanner','🔎 Scanner'],['event-report','📊 Event Ticket Report'],['sale-report','📊 Sale Ticket Report'],['history','📜 History'],['settings','⚙️ Settings']].map(x=>`<div class="card g"><h3>${x[1]}</h3><a class="btn" href="#${x[0]}" data-go="${x[0]}">Open</a></div>`).join('')+'</section>'}
function render(){let p=(location.hash||'#home').slice(1)||'home';try{if(['sale','entry','playing'].includes(p))page(p);else if(p=='event')eventPage();else if(p=='scanner')scanner();else if(p=='report')report();else if(p=='event-report')eventReport();else if(p=='sale-report')saleReport();else if(p=='history')history();else if(p=='settings')settings();else home();}catch(err){console.error('Page render error:',err);APP.innerHTML=nav('home')+'<section class="card g" style="margin-top:12px"><h2>Event Ticket Page Error</h2><p>Please tap Event Ticket again.</p><button onclick="go(\'event\')">Open Event Ticket</button></section>';}window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-go]');
  if(!el)return;
  const p=el.getAttribute('data-go');
  if(!p)return;
  e.preventDefault();
  location.hash='#'+p;
  render();
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
window.addEventListener('popstate',function(){render();window.scrollTo(0,0)});
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;localStorage.pdCanInstall='1'});async function installApp(){if(installPrompt){installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null}else alert('Chrome menu → Add to Home screen ကိုရွေးပြီး App အဖြစ်ထည့်နိုင်ပါတယ်။')}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
