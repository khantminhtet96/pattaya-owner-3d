<script>

let LOGIN_AT=localStorage.pdLoginAt||new Date().toISOString();localStorage.pdLoginAt=LOGIN_AT;if(!Array.isArray(E)){E=E&&typeof E==='object'?[E]:[]}E=E.filter(x=>x&&typeof x==='object').map(x=>({name:String(x.name||'Event Ticket'),qty:Math.max(0,Number(x.qty)||0),img:typeof x.img==='string'?x.img:''}));if(!E.length)E=[{name:'Event Ticket',qty:0,img:''}];if(!Array.isArray(H))H=[];for(let k in D){S[k]??={};M[k]??={}}if(!M.playing[0]||!M.playing[0].img)M.playing[0]={...(M.playing[0]||{}),name:(M.playing[0]&&M.playing[0].name)||'50฿ Activity Ticket',img:(M.playing[0]&&M.playing[0].img)||''};

function edit(k,n){t=k;i=n;let x=k=='event'?E[n]:D[k][n],m=k=='event'?x:(M[k][n]||{});document.getElementById('name').value=m.name||x[0];document.getElementById('prev').innerHTML=m.img?`<img src="${m.img}">`:'No image selected';document.getElementById('file').value='';document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}document.getElementById('file').onchange=()=>{let f=document.getElementById('file').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);document.getElementById('prev').innerHTML=`<img src="${c.toDataURL('image/jpeg',.78)}">`};im.src=r.result};r.readAsDataURL(f)};function saveM(){let nm=document.getElementById('name').value.trim()||'Event Ticket',pv=document.getElementById('prev').querySelector('img'),im=pv?pv.src:'';if(t=='event'){if(i<0)E.push({name:nm,qty:0,img:im});else E[i]={...E[i],name:nm,img:im}}else M[t][i]={name:nm,img:im};db();closeM();render()}
function calcScan(){let av=document.getElementById('a').value,bv=document.getElementById('b').value;document.getElementById('res').textContent=(+bv>=+av&&av&&bv)?(+bv-+av+1)+' Tickets Sold':'Enter valid numbers'}function scanner(){APP.innerHTML=nav('scanner')+hero('🔎 SCANNER','Ticket<br><span>Scanner.</span>','Start and Last numbers are counted inclusively.')+'<section class=\"card g\"><div class=\"grid\"><input id=\"a\" placeholder=\"Start 0001\"><input id=\"b\" placeholder=\"Last 0020\"></div><button onclick=\"calcScan()\">Calculate</button><h3 id=\"res\">0 Tickets Sold</h3></section>'}function saveToday(){H.unshift({d:new Date().toLocaleString(),s:total('sale'),e:total('entry'),p:total('playing'),v:E.reduce((a,x)=>a+(+x.qty||0),0)});db();alert('Saved')}function resetCounters(){if(confirm('Reset counters?')){for(let k in S)S[k]={};E.forEach(x=>x.qty=0);db();render()}}function currentReportText(){
 let p=(location.hash||'#home').slice(1)||'home',now=new Date().toLocaleString();
 let labels={home:'Home',sale:'Sale Ticket',entry:'Entry Ticket',playing:'Playing Ticket',event:'Event Ticket',scanner:'Scanner',report:'Reports',history:'History',settings:'Settings','event-report':'Event Ticket Report','sale-report':'Sale Ticket Report'};
 if(p==='event-report')return eventReportText();

 let lines=['PATTAYA DINOSAUR KINGDOM',(labels[p]||'Owner Page')+' REPORT','Date: '+now];
 if(p==='sale'||p==='entry'||p==='playing')lines.push('Tickets: '+total(p));
 else if(p==='event')lines.push('Event Tickets: '+E.reduce((a,x)=>a+(+x.qty||0),0),'Event Center: '+(EC||'Not set'));
 else if(p==='home')lines.push('Sale Tickets: '+total('sale'),'Entry Tickets: '+total('entry'),'Playing Tickets: '+total('playing'),'Event Tickets: '+E.reduce((a,x)=>a+(+x.qty||0),0));
 else lines.push('Page: '+(labels[p]||'Owner Page'));
 lines.push('','Thank you - Pattaya Dinosaur Kingdom');
 return lines.join('\n');
}

   E.forEach((x,n)=>rows.push({name:String(x.name||'Event Ticket'),qty:Math.max(0,Number(x.qty)||0),price:null,img:String(x.img||'')}));

function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function fitText(ctx,txt,maxWidth,font){
 ctx.font=font;
 let s=String(txt);
 if(ctx.measureText(s).width<=maxWidth)return s;
 while(s.length>3&&ctx.measureText(s+'…').width>maxWidth)s=s.slice(0,-1);
 return s+'…';
}
function loadReportImage(src){

   if(!src)return resolve(null);

async function buildReportImage(kind){
 const rows=ticketRowsForReport(kind);
 const W=1080,left=30,cardW=196,gap=12,cols=5,top=620,cardH=355;
 const rowsCount=Math.max(1,Math.ceil(rows.length/cols)),bottom=285;
 const H=Math.max(1680,top+rowsCount*cardH+bottom);
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');

async function shareReportImage(kind){
 const c=await buildReportImage(kind);
 const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));
 if(!blob){alert('Could not create the report image.');return}
 const file=new File([blob],`Pattaya-Dinosaur-Kingdom-${kind}-Report.png`,{type:'image/png'});
 // IMAGE ONLY: no URL and no text are attached to the share.
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 alert('Image Share is not supported by this browser. The PNG was saved; share it from your Gallery.');
}
