<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PDK Owner">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png">
<title>Pattaya Dinosaur Kingdom • Owner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182338;background:#f5f7fb}body{padding-bottom:78px}button,input{font:inherit}button{border:0;cursor:pointer}.app{width:min(100%,520px);margin:auto}.topbar{height:66px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #e8ebf2}.brand{display:flex;align-items:center;gap:9px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#9a78ff,#e06bb7);color:#fff;font-size:22px;box-shadow:0 8px 18px #7356b32b}.brand small{display:block;font-size:8px;letter-spacing:.12em;color:#8992a5;font-weight:800}.brand b{display:block;font-size:12px;letter-spacing:.01em}.online{font-size:10px;font-weight:800;color:#32a66b;background:#edf9f2;padding:7px 9px;border-radius:99px}.page{display:none;padding:12px}.page.active{display:block}.hero{border-radius:22px;padding:19px;color:#fff;background:linear-gradient(135deg,#201c46,#563f9a 55%,#c461a6);box-shadow:0 13px 30px #47367d20;position:relative;overflow:hidden}.hero:after{content:"🦖";position:absolute;right:-2px;bottom:-18px;font-size:90px;opacity:.16;transform:rotate(-8deg)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;opacity:.72}.hero h1{font-size:32px;line-height:.95;margin:7px 0}.hero p{font-size:11px;opacity:.78;margin:7px 0 0;max-width:350px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#fff;border:1px solid #e9ecf3;border-radius:17px;padding:12px 9px;box-shadow:0 5px 15px #26324b0a}.stat .ico{font-size:18px}.stat b{display:block;font-size:18px;margin-top:4px}.stat small{font-size:8px;color:#929aac;font-weight:800}.section{margin-top:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:9px;color:#929aac}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{background:#fff;border:1px solid #e9ecf3;border-radius:18px;padding:12px;text-align:left;min-height:76px;box-shadow:0 5px 15px #26324b08}.quick b{display:block;font-size:12px;margin-top:6px}.quick small{font-size:9px;color:#929aac}.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ticket{background:#fff;border:1px solid #e7eaf1;border-radius:18px;padding:9px;box-shadow:0 6px 16px #26324b09}.pic{height:108px;border-radius:13px;background:linear-gradient(135deg,#eef9ff,#f8efff);display:grid;place-items:center;overflow:hidden;font-size:42px}.pic img{width:100%;height:100%;object-fit:cover}.ticket small{display:block;color:#929aac;font-size:8px;font-weight:800;margin-top:8px}.ticket h3{font-size:12px;margin:3px 0}.price{font-size:13px;font-weight:900}.qty{display:flex;gap:5px;margin-top:7px}.qty button{width:34px;height:34px;border-radius:10px;background:#f0edff;color:#6549c8;font-size:19px;font-weight:900}.qty input{min-width:0;width:100%;border:1px solid #e7eaf1;background:#fafbfe;border-radius:10px;text-align:center;font-weight:900}.btn{padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,#8065ef,#d361ae);color:#fff;font-size:10px;font-weight:900}.btn.light{background:#f1efff;color:#6048bd}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.card{background:#fff;border:1px solid #e8ebf2;border-radius:18px;padding:13px;margin-top:9px}.card h3{font-size:13px;margin:0 0 8px}.input{width:100%;border:1px solid #e5e8ef;background:#fafbfe;border-radius:11px;padding:10px;font-size:12px;margin-bottom:7px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:8px 4px;border-bottom:1px solid #edf0f5}.empty{text-align:center;padding:25px;color:#9aa2b2;font-size:11px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:70px;background:#fff;border-top:1px solid #e7eaf1;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:7px 5px env(safe-area-inset-bottom)}.navbtn{background:transparent;color:#929aac;border-radius:13px;font-size:9px;font-weight:800}.navbtn .nicon{display:block;font-size:19px;margin-bottom:3px}.navbtn.active{background:#f0edff;color:#6048bd}.back{display:inline-flex;align-items:center;gap:4px;background:transparent;color:#6e7484;font-size:10px;font-weight:800;margin:2px 0 8px}.toast{position:fixed;left:50%;bottom:83px;transform:translate(-50%,20px);opacity:0;background:#182338;color:#fff;padding:9px 13px;border-radius:10px;font-size:10px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:0;background:#eef1f7}.app{box-shadow:0 0 50px #26324b12;min-height:100vh;background:#f7f8fc}.topbar{border-radius:0}.page{padding:18px}.ticket-grid{grid-template-columns:repeat(3,1fr)}.bottom{display:none}.hero h1{font-size:42px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">🦖</div><div><small>OWNER CONTROL</small><b>PATTAYA DINOSAUR KINGDOM</b></div></div><div class="online">● Online</div></header>
<main id="pages"></main>
<nav class="bottom"><button class="navbtn" data-page="home"><span class="nicon">⌂</span>Home</button><button class="navbtn" data-page="sale"><span class="nicon">🎟️</span>Sale</button><button class="navbtn" data-page="entry"><span class="nicon">🌿</span>Entry</button><button class="navbtn" data-page="playing"><span class="nicon">🦴</span>Playing</button><button class="navbtn" data-page="more"><span class="nicon">☰</span>More</button></nav>
</div><div id="toast" class="toast"></div>
<script>
const KEY='pdk-mobile-v1';
const defaults={sale:[['Adult',100],['Kid',80],['Small',60],['VIP',200],['Kids Entry Ticket',100]],entry:[['Adult',100],['Kid',80],['Small',60],['VIP',200],['Kids Entry Ticket',100]],playing:[['50฿ Activity Ticket',50],['100฿ Activity Ticket',100],['200฿ Activity Ticket',200],['Package A',250],['Package B',300],['Promotion Rider',150]],event:[['Event Ticket',50]]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{qty:{sale:[0,0,0,0,0],entry:[0,0,0,0,0],playing:[0,0,0,0,0,0],event:[0]},events:[{name:'Event Ticket',price:50,qty:0,img:''}],history:[],location:'Pattaya Dinosaur Kingdom',owner:'Owner'};
for(const k of Object.keys(defaults)){if(!Array.isArray(state.qty[k]))state.qty[k]=defaults[k].map(()=>0)}if(!Array.isArray(state.events)||!state.events.length)state.events=[{name:'Event Ticket',price:50,qty:0,img:''}];if(!Array.isArray(state.history))state.history=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const sum=k=>state.qty[k].reduce((a,b)=>a+(+b||0),0);const allTickets=()=>Object.values(state.qty).flat().reduce((a,b)=>a+(+b||0),0);const revenue=()=>Object.keys(defaults).reduce((t,k)=>t+defaults[k].reduce((s,x,i)=>s+x[1]*(state.qty[k][i]||0),0),0)+state.events.reduce((s,x)=>s+(+x.price||0)*(+x.qty||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
function card(k,i){const d=defaults[k][i];return `<article class="ticket"><div class="pic"><img src="./ticket-50.jpg" alt=""></div><small>${k.toUpperCase()}</small><h3>${esc(d[0])}</h3><div class="price">${d[1]} ฿</div><div class="qty"><button onclick="change('${k}',${i},-1)">−</button><input value="${state.qty[k][i]||0}" inputmode="numeric" onchange="setQty('${k}',${i},this.value)"><button onclick="change('${k}',${i},1)">+</button></div></article>`}
function change(k,i,n){state.qty[k][i]=Math.max(0,(+state.qty[k][i]||0)+n);save();render(location.hash.slice(1)||'home')}
function setQty(k,i,v){state.qty[k][i]=Math.max(0,parseInt(v)||0);save();render(location.hash.slice(1)||k)}
function header(eyebrow,title,desc){return `<button class="back" onclick="go('home')">‹ Back</button><section class="hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></section>`}
function home(){return `<section class="hero"><div class="eyebrow">MORE THAN A PARK</div><h1>PATTAYA<br>DINOSAUR KINGDOM</h1><p>Compact owner ticket control — every function has its own page.</p></section><div class="stats"><div class="stat"><span class="ico">🎟️</span><small>TICKETS</small><b>${allTickets()}</b></div><div class="stat"><span class="ico">฿</span><small>REVENUE</small><b>${revenue().toLocaleString()}</b></div><div class="stat"><span class="ico">👥</span><small>VISITORS</small><b>${allTickets()}</b></div></div><div class="section"><div class="section-head"><h2>Quick Access</h2><span>6 pages</span></div><div class="grid2"><button class="quick" onclick="go('sale')">🎟️<b>Sale Ticket</b><small>Ticket sales</small></button><button class="quick" onclick="go('entry')">🌿<b>Entry Ticket</b><small>Entrance</small></button><button class="quick" onclick="go('playing')">🦴<b>Playing Ticket</b><small>Activities</small></button><button class="quick" onclick="go('event')">🎪<b>Event Ticket</b><small>Events</small></button><button class="quick" onclick="go('reports')">📊<b>Reports</b><small>Daily report</small></button><button class="quick" onclick="go('history')">📜<b>History</b><small>Saved days</small></button></div></div><div class="card"><h3>📍 Event Location</h3><div style="font-size:11px;font-weight:800">${esc(state.location)}</div><div style="font-size:9px;color:#929aac;margin-top:3px">Nong Nooch Garden • Pattaya • Thailand</div></div>`}
function ticketPage(k,label,desc){return header(label,label+' Tickets',desc)+`<div class="toolbar"><button class="btn" onclick="save() ;toast('Saved')">💾 Save</button><button class="btn light" onclick="resetQty('${k}')">↻ Reset</button></div><div class="ticket-grid">${defaults[k].map((_,i)=>card(k,i)).join('')}</div><div class="card"><b style="font-size:12px">Total ${label} Tickets: ${sum(k)}</b></div>`}
function resetQty(k){if(confirm('Reset this page quantities?')){state.qty[k]=defaults[k].map(()=>0);save();render(k);toast('Reset complete')}}
function eventPage(){return header('EVENT MANAGEMENT','Event Ticket','Event tickets are kept on their own page and report.')}function eventList(){return `<div class="toolbar"><button class="btn" onclick="addEvent()">＋ Add Event Ticket</button><button class="btn light" onclick="go('event-report')">📊 Event Report</button></div><div class="ticket-grid">${state.events.map((e,i)=>`<article class="ticket"><div class="pic">${e.img?`<img src="${e.img}" alt="">`:'🎪'}</div><small>EVENT TICKET</small><h3>${esc(e.name)}</h3><div class="price">${e.price} ฿</div><div class="qty"><button onclick="eventQty(${i},-1)">−</button><input value="${e.qty||0}" onchange="eventSet(${i},this.value)"><button onclick="eventQty(${i},1)">+</button></div><div class="toolbar"><button class="btn light" onclick="editEvent(${i})">✏️ Edit</button><button class="btn light" onclick="deleteEvent(${i})">🗑️</button></div></article>`).join('')}</div>`}
function eventQty(i,n){state.events[i].qty=Math.max(0,(+state.events[i].qty||0)+n);save();render('event')}function eventSet(i,v){state.events[i].qty=Math.max(0,parseInt(v)||0);save();render('event')}
function addEvent(){const name=prompt('Event ticket name','Event Ticket');if(!name)return;const price=+prompt('Price (THB)','50');state.events.push({name,price:isFinite(price)?price:0,qty:0,img:''});save();render('event');toast('Event added')}
function editEvent(i){const name=prompt('Ticket name',state.events[i].name);if(name)state.events[i].name=name;const price=prompt('Price (THB)',state.events[i].price);if(price!==null&&isFinite(+price))state.events[i].price=+price;save();render('event')}
function deleteEvent(i){if(state.events.length===1){toast('Keep at least one event ticket');return}if(confirm('Delete this event ticket?')){state.events.splice(i,1);save();render('event')}}
function report(k=null){let rows='';if(k){rows=defaults[k].map((x,i)=>`<tr><td>${esc(x[0])}</td><td>${state.qty[k][i]||0}</td><td>${((state.qty[k][i]||0)*x[1]).toLocaleString()} ฿</td></tr>`).join('')}else{for(const x of ['sale','entry','playing'])rows+=defaults[x].map((d,i)=>`<tr><td>${esc(d[0])}</td><td>${state.qty[x][i]||0}</td><td>${((state.qty[x][i]||0)*d[1]).toLocaleString()} ฿</td></tr>`).join('');state.events.forEach(e=>rows+=`<tr><td>${esc(e.name)}</td><td>${e.qty||0}</td><td>${((e.qty||0)*(e.price||0)).toLocaleString()} ฿</td></tr>`)}return header('REPORT CENTER',k?(k==='event'?'Event Ticket Report':k+' Ticket Report'):'Sales Report','A clean, share-ready summary for the selected page.')+`<div class="card"><table class="table"><thead><tr><th>Ticket</th><th>Qty</th><th>Total</th></tr></thead><tbody>${rows||'<tr><td colspan="3">No data</td></tr>'}</tbody></table></div><div class="stats"><div class="stat"><small>TICKETS</small><b>${k==='event'?state.events.reduce((s,e)=>s+(e.qty||0),0):k?sum(k):allTickets()}</b></div><div class="stat"><small>REVENUE</small><b>${k==='event'?state.events.reduce((s,e)=>s+(e.qty||0)*(e.price||0),0).toLocaleString():k?defaults[k].reduce((s,x,i)=>s+x[1]*(state.qty[k][i]||0),0).toLocaleString():revenue().toLocaleString()} ฿</b></div></div><button class="btn" onclick="shareReport()">📤 Share Report</button>`}
function history(){return header('HISTORY','Daily History','Save a snapshot before closing the day.')+`<div class="toolbar"><button class="btn" onclick="snapshot()">💾 Save Today</button><button class="btn light" onclick="clearHistory()">🗑️ Clear</button></div>${state.history.length?state.history.map(h=>`<div class="card"><b style="font-size:12px">${esc(h.date)}</b><div style="font-size:10px;color:#929aac;margin-top:4px">Tickets: ${h.tickets} • Revenue: ${h.revenue.toLocaleString()} ฿</div></div>`).join(''):'<div class="empty">No saved history yet.</div>'}`}
function snapshot(){state.history.unshift({date:new Date().toLocaleString(),tickets:allTickets(),revenue:revenue()});save();render('history');toast('Today saved')}
function clearHistory(){if(confirm('Clear all history?')){state.history=[];save();render('history')}}
function more(){return header('MORE','More Pages','All secondary tools are separated here so the main ticket pages stay clean.')+`<div class="grid2"><button class="quick" onclick="go('reports')">📊<b>All Reports</b><small>Sales summary</small></button><button class="quick" onclick="go('event-report')">🎪<b>Event Report</b><small>Event only</small></button><button class="quick" onclick="go('scanner')">🔎<b>Scanner</b><small>Count ticket range</small></button><button class="quick" onclick="go('settings')">⚙️<b>Settings</b><small>Owner & location</small></button></div>`}
function scanner(){return header('SCANNER','Ticket Scanner','Enter first and last ticket numbers.');return ''}
function settings(){return header('SETTINGS','App Settings','Keep the owner controls simple and compact.')+`<div class="card"><h3>📍 Event Location</h3><input class="input" id="loc" value="${esc(state.location)}"><button class="btn" onclick="state.location=document.getElementById('loc').value.trim()||state.location;save();render('settings');toast('Saved')">Save Location</button></div><div class="card"><h3>👤 Owner</h3><input class="input" id="own" value="${esc(state.owner)}"><button class="btn" onclick="state.owner=document.getElementById('own').value.trim()||state.owner;save();render('settings');toast('Saved')">Save Owner</button></div><div class="card"><h3>💾 Backup</h3><button class="btn" onclick="backup()">Download Backup</button></div>`}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pattaya-dinosaur-backup.json';a.click();URL.revokeObjectURL(a.href)}
function shareReport(){const text=`Pattaya Dinosaur Kingdom\nTickets: ${allTickets()}\nRevenue: ${revenue().toLocaleString()} ฿\n${new Date().toLocaleString()}`;if(navigator.share)navigator.share({title:'PDK Ticket Report',text});else navigator.clipboard?.writeText(text).then(()=>toast('Report copied'))}
function go(p){location.hash=p}function render(p){const pages={home:home,sale:()=>ticketPage('sale','Sale','Record sale tickets quickly.'),entry:()=>ticketPage('entry','Entry','Track entrance tickets.'),playing:()=>ticketPage('playing','Playing','Activities and package tickets.'),event:()=>eventPage()+eventList(),reports:()=>report(), 'sale-report':()=>report('sale'),'entry-report':()=>report('entry'),'playing-report':()=>report('playing'),'event-report':()=>report('event'),history:history,more:more,settings:settings};const html=(pages[p]||home)();document.getElementById('pages').innerHTML=html;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(p.includes('report')&&b.dataset.page==='more')))}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'home'));render(location.hash.slice(1)||'home');
</script></body></html>
