async function shareReportImage(kind){
 const c=await buildReportImage(kind);
 const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));
 if(!blob){alert('Could not create the report image.');return}
 const file=new File([blob],`Pattaya-Dinosaur-Kingdom-${kind}-Report.png`,{type:'image/png'});
 const shareText=kind==='event'?eventReportText():kind==='sale'?saleReportText():reportText();
 // Universal Web Share: no LINE ID, no Social API keys. The generated report image
 // already contains the full report visually, so apps that ignore the text field
 // (such as some LINE Android flows) still receive the complete report image.
 if(navigator.share){
   try{
     if(navigator.canShare && navigator.canShare({files:[file]})){
       await navigator.share({title:'Pattaya Dinosaur Kingdom Report',text:shareText,files:[file]});
       return;
     }
     await navigator.share({title:'Pattaya Dinosaur Kingdom Report',text:shareText});
     return;
   }catch(e){if(e&&e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 try{
   await navigator.clipboard.writeText(shareText);
   alert('Report image saved and report text copied. Open LINE / Facebook / Messenger / Telegram / WhatsApp and share the image.');
 }catch(e){alert('Report image saved.');}
}
function sharePageReport(kind){
 if(kind==='event')return shareReportImage('event');
 if(kind==='sale')return shareReportImage('sale');
 return shareReportImage(kind);
}
